name: CI

on:
  push:
  pull_request:

jobs:
  dotnet:
    name: .NET ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test SimPulse.sln --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 7

  apple:
    name: Apple (placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record Apple verification as not executed
        run: |
          echo "NOT EXECUTED: no Xcode project in this repository (ADR 0009)."
          echo "A future macOS runner / Mac mini will invoke scripts/build-ios.sh and scripts/test-ios.sh."
