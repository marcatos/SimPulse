name: SimPulse
options:
  bundleIdPrefix: com.marcatos
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: YES
targets:
  SimPulse:
    type: application
    platform: iOS
    sources:
      - path: apps/ios/SimPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcatos.SimPulse
        INFOPLIST_KEY_CFBundleDisplayName: SimPulse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: SimPulse reads heart rate and energy from Apple Watch workouts you start in the app. Not a medical device.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: SimPulse saves Sim Racing workouts to Health so they stay on this iPhone.
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: SimPulseWatch
        embed: true
    scheme:
      gatherCoverageData: false
  SimPulseWatch:
    type: application
    platform: watchOS
    sources:
      - path: apps/watchos/SimPulseWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcatos.SimPulse.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: SimPulse
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.marcatos.SimPulse
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: SimPulse Watch records heart rate during a Sim Racing workout. Not a medical device.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: SimPulse Watch writes the Sim Racing workout to Health on this Apple Watch.
        WKApplication: YES
        TARGETED_DEVICE_FAMILY: "4"
    scheme:
      gatherCoverageData: false
