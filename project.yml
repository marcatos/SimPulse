name: SimPulse
options:
  bundleIdPrefix: com.marcatos
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: YES
targets:
  SimPulse:
    type: application
    platform: iOS
    sources:
      - path: apps/ios/SimPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcatos.SimPulse
        INFOPLIST_KEY_CFBundleDisplayName: SimPulse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: SimPulse reads heart rate, energy, and past Sim Racing workouts from Health. Not a medical device.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: SimPulse may save Sim Racing workout data to Health on this iPhone. Not a medical device.
        CODE_SIGN_ENTITLEMENTS: apps/ios/SimPulse/SimPulse.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: SimPulseWatch
        embed: true
    scheme:
      gatherCoverageData: false
      testTargets:
        - SimPulseTests
  SimPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: apps/ios/SimPulseTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcatos.SimPulse.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SimPulse.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SimPulse"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SimPulse
  SimPulseWatch:
    type: application
    platform: watchOS
    sources:
      - path: apps/watchos/SimPulseWatch
      - path: apps/ios/SimPulse/Sync
      - path: apps/ios/SimPulse/Workout
        excludes:
          - HealthKitWorkoutDataSource.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcatos.SimPulse.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: SimPulse
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.marcatos.SimPulse
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: SimPulse Watch records heart rate during a Sim Racing workout. Not a medical device.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: SimPulse Watch writes the Sim Racing workout to Health on this Apple Watch.
        WKApplication: YES
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: apps/watchos/SimPulseWatch/SimPulseWatch.entitlements
    scheme:
      gatherCoverageData: false
